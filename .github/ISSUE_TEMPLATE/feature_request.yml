name: Feature request
description: Suggest a new tool, mode, or capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project intentionally stays small and low-risk on purpose (see
        "What this is for" in the README) -- personal, low-volume use, no
        checkout automation, no scraping. Requests that push against that
        scope (e.g. automated payment submission) are likely to be declined
        regardless of feasibility -- see docs/ARCHITECTURE.md for why
        `place_order` never submits payment.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't currently possible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
